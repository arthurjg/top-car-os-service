version: '3.8'

networks:
  local:

services:
  db-top-car-postgres:
    image: postgres:15-alpine
    container_name: db-top-car-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: top-car-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d top-car-db || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - local
      
  top-car-os-service-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENV: dev
    image: top-car-os-service-api:1.4.0
    container_name: top-car-os-service-api
    restart: unless-stopped
    ports:
      - "8082:8082"    
    depends_on:
      - db-top-car-postgres
    networks:
      - local
    environment:
      - ENV=dev

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

volumes:
  postgres_data:
    name: top_car_postgres_data
