# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CD with Maven

on:  
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read

env:
  AWS_REGION: us-east-1                   
  ECR_REPOSITORY: top-car-service-app
  EKS_CLUSTER_NAME: top-car-eks-cluster

jobs:
  deploy:      
    
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          #aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }} DISABILITADO!!!!
          aws-region: ${{ env.AWS_REGION }}
      
    - name: Update kubeconfig and deploy to EKS
      run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

    - name: Deploy to EKS
      run: |
        kubectl apply -f k8s/configmap.yaml
        kubectl apply -f k8s/secrets.yaml    
        kubectl apply -f k8s/deployment-db.yaml
        kubectl apply -f k8s/service-db.yaml
        kubectl apply -f k8s/deployment-app-aws.yaml
        kubectl apply -f k8s/service-lb.yaml
        kubectl apply -f k8s/hpa.yaml
        
          
